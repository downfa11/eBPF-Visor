version: "3.9"
services:
  ebpf-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebpf-app
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    privileged: true
    environment:
      - DEV=eth0
    restart: unless-stopped
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    network_mode: "host"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DASHBOARDS_JSON_ENABLED=true
      - GF_DASHBOARDS_JSON_PATH=/app/dashboards
    volumes:
      - ./grafana-dashboard.json:/app/dashboards/grafana-dashboard.json:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus